  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #2C3E6B; --gold: #C9A84C; --cream: #F7F5F0;
      --text: #2C2C2A; --text-muted: #888780;
      --border: rgba(60,60,58,0.12); --bg-section: #F9F8F5;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans JP', sans-serif; color: var(--text); background: #fff; font-size: 15px; line-height: 1.7; }
    .header { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 0.5px solid var(--border); }
    .nav-top { display: flex; align-items: center; justify-content: space-between; padding: 0 48px; height: 68px; gap: 32px; }
    .nav-logo { font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 600; color: var(--navy); letter-spacing: 1px; text-decoration: none; flex-shrink: 0; }
    .nav-links { display: flex; list-style: none; align-items: center; flex: 1; justify-content: center; }
    .nav-links li { display: flex; align-items: center; }
    .nav-links li + li::before { content: '|'; color: #ccc; font-size: 13px; padding: 0 4px; }
    .nav-links a { display: block; padding: 8px 18px; font-size: 13px; color: #2C2C2A; text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: var(--gold); }
    .nav-cta { display: inline-block; padding: 10px 28px; background: var(--gold); color: var(--navy); font-size: 13px; font-weight: 500; border-radius: 4px; text-decoration: none; flex-shrink: 0; transition: opacity 0.2s; }
    .nav-cta:hover { opacity: 0.85; }
    .breadcrumb { padding: 14px 48px; font-size: 12px; color: var(--text-muted); border-bottom: 0.5px solid var(--border); display: flex; gap: 8px; align-items: center; }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--gold); }
    .footer { text-align: center; padding: 24px 48px; font-size: 12px; color: var(--text-muted); border-top: 0.5px solid var(--border); }
    @media (max-width: 768px) {
      .nav-top { padding: 0 20px; } .nav-links { display: none; }
      .breadcrumb { padding: 12px 20px; }
      .cs-title { font-size: 28px !important; }
      .cs-wrap { padding: 64px 24px !important; }
    }
  </style>
</head>
